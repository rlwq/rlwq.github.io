<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 156" width="620" height="156" role="img" aria-label="Animated execution of *&lt;*[&gt;] on a bi-infinite binary tape">
  <defs>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="b"/><feComponentTransfer in="b" result="h"><feFuncA type="linear" slope="0.6"/></feComponentTransfer><feMerge><feMergeNode in="h"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="tf0" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="2" height="2" fill="#fff"/><rect x="4" y="4" width="2" height="2" fill="#fff"/></pattern>
    <pattern id="tf1" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="2" height="2" fill="#fff"/><rect x="4" y="0" width="2" height="2" fill="#fff"/><rect x="2" y="2" width="2" height="2" fill="#fff"/><rect x="0" y="4" width="2" height="2" fill="#fff"/><rect x="4" y="4" width="2" height="2" fill="#fff"/><rect x="6" y="6" width="2" height="2" fill="#fff"/></pattern>
    <pattern id="tf2" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="2" height="2" fill="#fff"/><rect x="2" y="0" width="2" height="2" fill="#fff"/><rect x="4" y="0" width="2" height="2" fill="#fff"/><rect x="2" y="2" width="2" height="2" fill="#fff"/><rect x="6" y="2" width="2" height="2" fill="#fff"/><rect x="0" y="4" width="2" height="2" fill="#fff"/><rect x="4" y="4" width="2" height="2" fill="#fff"/><rect x="6" y="4" width="2" height="2" fill="#fff"/><rect x="2" y="6" width="2" height="2" fill="#fff"/><rect x="6" y="6" width="2" height="2" fill="#fff"/></pattern>
    <pattern id="tf3" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="2" height="2" fill="#fff"/><rect x="2" y="0" width="2" height="2" fill="#fff"/><rect x="4" y="0" width="2" height="2" fill="#fff"/><rect x="6" y="0" width="2" height="2" fill="#fff"/><rect x="0" y="2" width="2" height="2" fill="#fff"/><rect x="2" y="2" width="2" height="2" fill="#fff"/><rect x="6" y="2" width="2" height="2" fill="#fff"/><rect x="0" y="4" width="2" height="2" fill="#fff"/><rect x="2" y="4" width="2" height="2" fill="#fff"/><rect x="4" y="4" width="2" height="2" fill="#fff"/><rect x="6" y="4" width="2" height="2" fill="#fff"/><rect x="2" y="6" width="2" height="2" fill="#fff"/><rect x="4" y="6" width="2" height="2" fill="#fff"/><rect x="6" y="6" width="2" height="2" fill="#fff"/></pattern>
    <mask id="tapeMask" maskUnits="userSpaceOnUse"><rect x="102" y="39" width="416" height="50" fill="#fff"/><rect x="46" y="39" width="14" height="50" fill="url(#tf0)"/><rect x="560" y="39" width="14" height="50" fill="url(#tf0)"/><rect x="60" y="39" width="14" height="50" fill="url(#tf1)"/><rect x="546" y="39" width="14" height="50" fill="url(#tf1)"/><rect x="74" y="39" width="14" height="50" fill="url(#tf2)"/><rect x="532" y="39" width="14" height="50" fill="url(#tf2)"/><rect x="88" y="39" width="14" height="50" fill="url(#tf3)"/><rect x="518" y="39" width="14" height="50" fill="url(#tf3)"/></mask>
    <style>
      .bft-cell  { fill: var(--muted, #1a1a19); }
      .bft-grid  { stroke: var(--border, #292826); stroke-width: 1; shape-rendering: crispEdges; }
      .bft-z     { font: 400 18px var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace); fill: var(--muted-foreground, #a19e98); opacity: 0.45; text-anchor: middle; dominant-baseline: central; }
      .bft-o     { font: 500 18px var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace); fill: var(--foreground, #e7e5e2); text-anchor: middle; dominant-baseline: central; }
      .bft-dots  { font: 400 16px var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace); fill: var(--muted-foreground, #a19e98); opacity: 0.5; text-anchor: middle; dominant-baseline: central; }
      .bft-acc   { fill: var(--primary, #f0a04b); }
      .bft-frame { fill: none; stroke: var(--primary, #f0a04b); stroke-width: 1.5; }
      .bft-lbl   { font: 500 10.5px var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace); letter-spacing: 0.06em; fill: var(--primary, #f0a04b); text-anchor: middle; dominant-baseline: central; }
      .bft-meta  { font: 400 10.5px var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace); letter-spacing: 0.06em; fill: var(--muted-foreground, #a19e98); dominant-baseline: central; }
      .bft-tok-bg { fill: var(--muted, #1a1a19); stroke: var(--border, #292826); stroke-width: 1; }
      .bft-tok   { font: 500 15px var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace); fill: var(--foreground, #e7e5e2); text-anchor: middle; dominant-baseline: central; }
      .bft-halt  { font: 500 10.5px var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace); letter-spacing: 0.06em; fill: var(--primary, #f0a04b); dominant-baseline: central; opacity: 0; animation: bft-halt 10s ease-in-out infinite; }
      .bft-pc    { fill: color-mix(in srgb, var(--primary, #f0a04b) 14%, transparent); stroke: var(--primary, #f0a04b); stroke-width: 1; opacity: 0; animation: bft-pc 10s ease-in-out infinite; }

      .bft-cursor { animation: bft-cursor 10s ease-in-out infinite; }
      .bft-c0-z   { animation: bft-c0-z 10s linear infinite; }
      .bft-c0-o   { opacity: 0; animation: bft-c0-o 10s linear infinite; }
      .bft-cm1-z  { animation: bft-cm1-z 10s linear infinite; }
      .bft-cm1-o  { opacity: 0; animation: bft-cm1-o 10s linear infinite; }
      .bft-t0 { animation: bft-t0 10s linear infinite; }
      .bft-t1 { animation: bft-t1 10s linear infinite; }
      .bft-t2 { animation: bft-t2 10s linear infinite; }
      .bft-t3 { animation: bft-t3 10s linear infinite; }
      .bft-t4 { animation: bft-t4 10s linear infinite; }

      /* Cursor slides: 0 -> -1 (step 2) -> 0 (step 5) -> +1 (step 7) -> reset */
      @keyframes bft-cursor {
        0%, 18%    { transform: translateX(0px); }
        22.5%, 45% { transform: translateX(-48px); }
        49.5%, 63% { transform: translateX(0px); }
        67.5%, 94% { transform: translateX(48px); }
        98%, 100%  { transform: translateX(0px); }
      }
      /* Cell 0 flips 0 -> 1 at step 1 (10%), resets at 95% */
      @keyframes bft-c0-z { 0%, 9.5% { opacity: 0.45; } 11%, 94.5% { opacity: 0; } 96.5%, 100% { opacity: 0.45; } }
      @keyframes bft-c0-o { 0%, 9.5% { opacity: 0; } 11%, 94.5% { opacity: 1; } 96.5%, 100% { opacity: 0; } }
      /* Cell -1 flips 0 -> 1 at step 3 (28%), resets at 95% */
      @keyframes bft-cm1-z { 0%, 27.5% { opacity: 0.45; } 29%, 94.5% { opacity: 0; } 96.5%, 100% { opacity: 0.45; } }
      @keyframes bft-cm1-o { 0%, 27.5% { opacity: 0; } 29%, 94.5% { opacity: 1; } 96.5%, 100% { opacity: 0; } }
      /* Program highlight: idx 0, 1, 2, 3, 4, 3, 4, 3 then off */
      @keyframes bft-pc {
        0%, 6.5%     { opacity: 0; transform: translateX(0px); }
        8%, 15.5%    { opacity: 1; transform: translateX(0px); }
        17.5%, 24.5% { opacity: 1; transform: translateX(36px); }
        26.5%, 33.5% { opacity: 1; transform: translateX(72px); }
        35.5%, 42.5% { opacity: 1; transform: translateX(108px); }
        44.5%, 51.5% { opacity: 1; transform: translateX(144px); }
        53.5%, 60.5% { opacity: 1; transform: translateX(108px); }
        62.5%, 69.5% { opacity: 1; transform: translateX(144px); }
        71.5%, 78.5% { opacity: 1; transform: translateX(108px); }
        80.5%, 100%  { opacity: 0; transform: translateX(108px); }
      }
      /* Active command lights up */
      @keyframes bft-t0 { 0%, 7%, 16.5%, 100% { fill: var(--foreground, #e7e5e2); } 8%, 15.5% { fill: var(--primary, #f0a04b); } }
      @keyframes bft-t1 { 0%, 16.5%, 25.5%, 100% { fill: var(--foreground, #e7e5e2); } 17.5%, 24.5% { fill: var(--primary, #f0a04b); } }
      @keyframes bft-t2 { 0%, 25.5%, 34.5%, 100% { fill: var(--foreground, #e7e5e2); } 26.5%, 33.5% { fill: var(--primary, #f0a04b); } }
      @keyframes bft-t3 {
        0%, 34.5%, 43.5%, 52.5%, 61.5%, 70.5%, 79.5%, 100% { fill: var(--foreground, #e7e5e2); }
        35.5%, 42.5%, 53.5%, 60.5%, 71.5%, 78.5%           { fill: var(--primary, #f0a04b); }
      }
      @keyframes bft-t4 {
        0%, 43.5%, 52.5%, 61.5%, 70.5%, 100% { fill: var(--foreground, #e7e5e2); }
        44.5%, 51.5%, 62.5%, 69.5%           { fill: var(--primary, #f0a04b); }
      }
      /* Halt label after step 8 */
      @keyframes bft-halt { 0%, 79% { opacity: 0; } 81%, 93% { opacity: 1; } 95%, 100% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .bft-cursor, .bft-c0-z, .bft-c0-o, .bft-cm1-z, .bft-cm1-o,
        .bft-pc, .bft-t0, .bft-t1, .bft-t2, .bft-t3, .bft-t4, .bft-halt { animation: none !important; }
        .bft-c0-z, .bft-cm1-z { opacity: 0; }
        .bft-c0-o, .bft-cm1-o, .bft-halt { opacity: 1; }
        .bft-pc { opacity: 1; transform: translateX(108px); }
      }
    </style>
  </defs>
  <g mask="url(#tapeMask)">
    <rect x="46" y="40" width="528" height="48" class="bft-cell"/>
    <g class="bft-grid">
      <line x1="46" y1="40.5" x2="574" y2="40.5"/>
      <line x1="46" y1="87.5" x2="574" y2="87.5"/>
      <line x1="94.5" y1="40" x2="94.5" y2="88"/>
      <line x1="142.5" y1="40" x2="142.5" y2="88"/>
      <line x1="190.5" y1="40" x2="190.5" y2="88"/>
      <line x1="238.5" y1="40" x2="238.5" y2="88"/>
      <line x1="286.5" y1="40" x2="286.5" y2="88"/>
      <line x1="334.5" y1="40" x2="334.5" y2="88"/>
      <line x1="382.5" y1="40" x2="382.5" y2="88"/>
      <line x1="430.5" y1="40" x2="430.5" y2="88"/>
      <line x1="478.5" y1="40" x2="478.5" y2="88"/>
      <line x1="526.5" y1="40" x2="526.5" y2="88"/>
    </g>
    <text x="70.0" y="64.0" class="bft-z">0</text>
    <text x="118.0" y="64.0" class="bft-z">0</text>
    <text x="166.0" y="64.0" class="bft-z">0</text>
    <text x="214.0" y="64.0" class="bft-z">0</text>
    <text x="262.0" y="64.0" class="bft-z bft-cm1-z">0</text>
    <text x="262.0" y="64.0" class="bft-o bft-cm1-o" filter="url(#glow)">1</text>
    <text x="310.0" y="64.0" class="bft-z bft-c0-z">0</text>
    <text x="310.0" y="64.0" class="bft-o bft-c0-o" filter="url(#glow)">1</text>
    <text x="358.0" y="64.0" class="bft-z">0</text>
    <text x="406.0" y="64.0" class="bft-z">0</text>
    <text x="454.0" y="64.0" class="bft-z">0</text>
    <text x="502.0" y="64.0" class="bft-z">0</text>
    <text x="550.0" y="64.0" class="bft-z">0</text>
  </g>
  <text x="24" y="64.0" class="bft-dots">…</text>
  <text x="596" y="64.0" class="bft-dots">…</text>
  <g class="bft-cursor">
    <text x="310" y="10" class="bft-lbl" filter="url(#glow)">CURSOR</text>
    <g filter="url(#glow)"><rect x="305" y="22" width="10" height="2" class="bft-acc"/><rect x="307" y="24" width="6" height="2" class="bft-acc"/><rect x="309" y="26" width="2" height="2" class="bft-acc"/></g>
    <rect x="286.75" y="40.75" width="46.5" height="46.5" class="bft-frame" filter="url(#glow)"/>
  </g>
  <text x="191" y="128.0" class="bft-meta" text-anchor="end" style="text-anchor: end">PROGRAM</text>
  <rect x="205.5" y="112.5" width="29" height="31" rx="3" class="bft-tok-bg"/>
  <rect x="241.5" y="112.5" width="29" height="31" rx="3" class="bft-tok-bg"/>
  <rect x="277.5" y="112.5" width="29" height="31" rx="3" class="bft-tok-bg"/>
  <rect x="313.5" y="112.5" width="29" height="31" rx="3" class="bft-tok-bg"/>
  <rect x="349.5" y="112.5" width="29" height="31" rx="3" class="bft-tok-bg"/>
  <rect x="385.5" y="112.5" width="29" height="31" rx="3" class="bft-tok-bg"/>
  <rect x="205.5" y="112.5" width="29" height="31" rx="3" class="bft-pc" filter="url(#glow)"/>
  <text x="220.0" y="128.0" class="bft-tok bft-t0">*</text>
  <text x="256.0" y="128.0" class="bft-tok bft-t1">&lt;</text>
  <text x="292.0" y="128.0" class="bft-tok bft-t2">*</text>
  <text x="328.0" y="128.0" class="bft-tok bft-t3">[</text>
  <text x="364.0" y="128.0" class="bft-tok bft-t4">&gt;</text>
  <text x="400.0" y="128.0" class="bft-tok">]</text>
  <text x="431" y="128.0" class="bft-halt" filter="url(#glow)">HALT · 8 STEPS</text>
</svg>
