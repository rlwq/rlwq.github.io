<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 248" width="600" height="248" role="img" aria-label="Expanding a gap of size 4 one command at a time">
  <defs>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="b"/><feComponentTransfer in="b" result="h"><feFuncA type="linear" slope="0.6"/></feComponentTransfer><feMerge><feMergeNode in="h"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="expArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" class="exp-arr"/>
    </marker>
    <style>
      .exp-node { fill: var(--muted, #1a1a19); stroke: var(--border, #292826); stroke-width: 1; }
      .exp-halt { fill: var(--muted, #1a1a19); stroke: var(--primary, #f0a04b); stroke-width: 1; }
      .exp-code { font: 500 13px var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace); fill: var(--foreground, #e7e5e2); text-anchor: middle; dominant-baseline: central; }
      .exp-edge { fill: none; stroke: var(--muted-foreground, #a19e98); stroke-width: 1; opacity: 0.55; }
      .exp-arr { fill: var(--muted-foreground, #a19e98); opacity: 0.55; }
      .exp-sub { font: 400 10px var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace); letter-spacing: 0.06em; fill: var(--muted-foreground, #a19e98); text-anchor: middle; }
      .exp-loop { fill: var(--muted, #1a1a19); stroke: color-mix(in srgb, var(--primary, #f0a04b) 55%, transparent); stroke-width: 1; }
      .exp-sub-loop { font: 500 10px var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace); letter-spacing: 0.06em; fill: var(--primary, #f0a04b); opacity: 0.7; text-anchor: middle; }
      .exp-sub-halt { font: 500 10px var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace); letter-spacing: 0.06em; fill: var(--primary, #f0a04b); text-anchor: middle; }
    </style>
  </defs>

  <!-- Root 4? (cx 300) -> level 1 -->
  <path d="M 300 42 C 300 64, 100 62, 100 84" class="exp-edge" marker-end="url(#expArr)"/>
  <path d="M 300 42 C 300 64, 176 62, 176 84" class="exp-edge" marker-end="url(#expArr)"/>
  <path d="M 300 42 C 300 64, 252 62, 252 84" class="exp-edge" marker-end="url(#expArr)"/>
  <path d="M 300 42 C 300 64, 328 62, 328 84" class="exp-edge" marker-end="url(#expArr)"/>
  <path d="M 300 42 C 300 64, 414 62, 414 84" class="exp-edge" marker-end="url(#expArr)"/>
  <path d="M 300 42 C 300 64, 500 62, 500 84" class="exp-edge" marker-end="url(#expArr)"/>

  <!-- *3? (cx 252) -> level 2 -->
  <path d="M 252 118 C 252 156, 100 150, 100 184" class="exp-edge" marker-end="url(#expArr)"/>
  <path d="M 252 118 C 252 156, 176 150, 176 184" class="exp-edge" marker-end="url(#expArr)"/>
  <path d="M 252 118 C 252 156, 252 150, 252 184" class="exp-edge" marker-end="url(#expArr)"/>
  <path d="M 252 118 C 252 156, 328 150, 328 184" class="exp-edge" marker-end="url(#expArr)"/>
  <path d="M 252 118 C 252 156, 420 150, 420 184" class="exp-edge" marker-end="url(#expArr)"/>

  <!-- Root -->
  <g>
    <rect x="272" y="10" width="56" height="32" rx="3" class="exp-node"/>
    <text x="300" y="26" class="exp-code">ω4</text>
  </g>

  <!-- Level 1 -->
  <g>
    <rect x="72" y="86" width="56" height="32" rx="3" class="exp-node"/>
    <text x="100" y="102" class="exp-code">&lt;ω3</text>
    <text x="100" y="134" class="exp-sub">…</text>
  </g>
  <g>
    <rect x="148" y="86" width="56" height="32" rx="3" class="exp-node"/>
    <text x="176" y="102" class="exp-code">&gt;ω3</text>
    <text x="176" y="134" class="exp-sub">…</text>
  </g>
  <g>
    <rect x="224" y="86" width="56" height="32" rx="3" class="exp-node"/>
    <text x="252" y="102" class="exp-code">*ω3</text>
  </g>
  <g>
    <rect x="300" y="86" width="56" height="32" rx="3" class="exp-node"/>
    <text x="328" y="102" class="exp-code">[]ω2</text>
    <text x="328" y="134" class="exp-sub">…</text>
  </g>
  <g>
    <rect x="376" y="86" width="76" height="32" rx="3" class="exp-halt" filter="url(#glow)"/>
    <text x="414" y="102" class="exp-code">[ω1]ω1</text>
    <text x="414" y="134" class="exp-sub-halt" filter="url(#glow)">HALTS IN 2</text>
  </g>
  <g>
    <rect x="472" y="86" width="56" height="32" rx="3" class="exp-halt" filter="url(#glow)"/>
    <text x="500" y="102" class="exp-code">[ω2]</text>
    <text x="500" y="134" class="exp-sub-halt" filter="url(#glow)">HALTS IN 1</text>
  </g>

  <!-- Level 2 under *3? -->
  <g>
    <rect x="68" y="186" width="64" height="32" rx="3" class="exp-node"/>
    <text x="100" y="202" class="exp-code">*&lt;ω2</text>
    <text x="100" y="234" class="exp-sub">…</text>
  </g>
  <g>
    <rect x="144" y="186" width="64" height="32" rx="3" class="exp-node"/>
    <text x="176" y="202" class="exp-code">*&gt;ω2</text>
    <text x="176" y="234" class="exp-sub">…</text>
  </g>
  <g>
    <rect x="220" y="186" width="64" height="32" rx="3" class="exp-node"/>
    <text x="252" y="202" class="exp-code">**ω2</text>
    <text x="252" y="234" class="exp-sub">…</text>
  </g>
  <g>
    <rect x="296" y="186" width="64" height="32" rx="3" class="exp-loop"/>
    <text x="328" y="202" class="exp-code">*[]ω1</text>
    <text x="328" y="234" class="exp-sub-loop">NEVER HALTS</text>
  </g>
  <g>
    <rect x="388" y="186" width="64" height="32" rx="3" class="exp-halt" filter="url(#glow)"/>
    <text x="420" y="202" class="exp-code">*[ω1]</text>
    <text x="420" y="234" class="exp-sub-halt" filter="url(#glow)">HALTS IN 4</text>
  </g>
</svg>
