<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 248" width="552" height="248" role="img" aria-label="Two levels of Tree Normal Form expansion from a size-3 gap">
  <defs>
    <marker id="tnfArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" class="tnf-arr"/>
    </marker>
    <marker id="tnfArrFade" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" class="tnf-arr-fade"/>
    </marker>
    <style>
      .tnf-node      { fill: var(--muted, #f2f1ee); stroke: var(--border, #e2e0dc); stroke-width: 1.25; }
      .tnf-pruned    { fill: none; stroke: var(--border, #e2e0dc); stroke-width: 1.25; stroke-dasharray: 4 3; opacity: 0.75; }
      .tnf-halt      { fill: var(--muted, #f2f1ee); stroke: var(--tip, #3d7d3a); stroke-width: 1.45; }
      .tnf-code      { font: 600 13px var(--font-mono, ui-monospace, 'SF Mono', Menlo, Consolas, monospace); fill: var(--foreground, #1c1b1a); text-anchor: middle; dominant-baseline: central; }
      .tnf-code-fade { font: 500 13px var(--font-mono, ui-monospace, 'SF Mono', Menlo, Consolas, monospace); fill: var(--muted-foreground, #5f5d59); text-anchor: middle; dominant-baseline: central; opacity: 0.65; }
      .tnf-edge      { fill: none; stroke: var(--muted-foreground, #5f5d59); stroke-width: 1.35; opacity: 0.72; }
      .tnf-edge-fade { fill: none; stroke: var(--muted-foreground, #5f5d59); stroke-width: 1.25; stroke-dasharray: 4 3; opacity: 0.42; }
      .tnf-arr       { fill: var(--muted-foreground, #5f5d59); opacity: 0.72; }
      .tnf-arr-fade  { fill: var(--muted-foreground, #5f5d59); opacity: 0.42; }
      .tnf-sub       { font: 500 11.5px var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif); fill: var(--muted-foreground, #5f5d59); text-anchor: middle; }
      .tnf-sub-end   { font: 500 11.5px var(--font-mono, ui-monospace, 'SF Mono', Menlo, Consolas, monospace); fill: var(--muted-foreground, #5f5d59); text-anchor: end; }
      .tnf-sub-halt  { font: 600 11.5px var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif); fill: var(--tip, #3d7d3a); text-anchor: middle; }
    </style>
  </defs>

  <!-- Level 0 -> Level 1 edges from root (276, 42) -->
  <path d="M 276 42 C 276 64, 134 62, 134 84"  class="tnf-edge"      marker-end="url(#tnfArr)"/>
  <path d="M 276 42 C 276 64, 224 62, 224 84"  class="tnf-edge-fade" marker-end="url(#tnfArrFade)"/>
  <path d="M 276 42 C 276 64, 312 62, 312 84"  class="tnf-edge"      marker-end="url(#tnfArr)"/>
  <path d="M 276 42 C 276 64, 404 62, 404 84"  class="tnf-edge"      marker-end="url(#tnfArr)"/>
  <path d="M 276 42 C 276 64, 506 62, 506 84"  class="tnf-edge"      marker-end="url(#tnfArr)"/>

  <!-- Level 1 -> Level 2 edges from <2? (134, 118) -->
  <path d="M 134 118 C 134 156, 42 150, 42 184"   class="tnf-edge"      marker-end="url(#tnfArr)"/>
  <path d="M 134 118 C 134 156, 122 150, 122 184" class="tnf-edge-fade" marker-end="url(#tnfArrFade)"/>
  <path d="M 134 118 C 134 156, 202 150, 202 184" class="tnf-edge"      marker-end="url(#tnfArr)"/>
  <path d="M 134 118 C 134 162, 294 150, 294 184" class="tnf-edge"      marker-end="url(#tnfArr)"/>

  <!-- Level 1 -> Level 2 edge from [1?]0? (506, 118) -->
  <line x1="506" y1="118" x2="506" y2="184" class="tnf-edge" marker-end="url(#tnfArr)"/>
  <text x="496" y="155" class="tnf-sub-end">0? → ε</text>

  <!-- Root: 3? -->
  <g>
    <rect x="248" y="10" width="56" height="32" rx="6" class="tnf-node"/>
    <text x="276" y="26" class="tnf-code">3?</text>
  </g>

  <!-- Level 1 -->
  <g>
    <rect x="102" y="86" width="64" height="32" rx="6" class="tnf-node"/>
    <text x="134" y="102" class="tnf-code">&lt;2?</text>
  </g>
  <g>
    <rect x="192" y="86" width="64" height="32" rx="6" class="tnf-pruned"/>
    <text x="224" y="102" class="tnf-code-fade">&gt;2?</text>
    <text x="224" y="133" class="tnf-sub">mirror</text>
  </g>
  <g>
    <rect x="280" y="86" width="64" height="32" rx="6" class="tnf-node"/>
    <text x="312" y="102" class="tnf-code">*2?</text>
    <text x="312" y="133" class="tnf-sub">…</text>
  </g>
  <g>
    <rect x="366" y="86" width="76" height="32" rx="6" class="tnf-node"/>
    <text x="404" y="102" class="tnf-code">[0?]1?</text>
    <text x="404" y="133" class="tnf-sub">…</text>
  </g>
  <g>
    <rect x="468" y="86" width="76" height="32" rx="6" class="tnf-node"/>
    <text x="506" y="102" class="tnf-code">[1?]0?</text>
  </g>

  <!-- Level 2 under <2? -->
  <g>
    <rect x="8" y="186" width="68" height="32" rx="6" class="tnf-node"/>
    <text x="42" y="202" class="tnf-code">&lt;&lt;1?</text>
  </g>
  <g>
    <rect x="88" y="186" width="68" height="32" rx="6" class="tnf-pruned"/>
    <text x="122" y="202" class="tnf-code-fade">&lt;&gt;1?</text>
    <text x="122" y="234" class="tnf-sub">cancel</text>
  </g>
  <g>
    <rect x="168" y="186" width="68" height="32" rx="6" class="tnf-node"/>
    <text x="202" y="202" class="tnf-code">&lt;*1?</text>
  </g>
  <g>
    <rect x="248" y="186" width="92" height="32" rx="6" class="tnf-node"/>
    <text x="294" y="202" class="tnf-code">&lt;[0?]0?</text>
  </g>

  <!-- Level 2 under [1?]0? -->
  <g>
    <rect x="472" y="186" width="68" height="32" rx="6" class="tnf-halt"/>
    <text x="506" y="202" class="tnf-code">[1?]</text>
    <text x="506" y="234" class="tnf-sub-halt">halts in 1</text>
  </g>
</svg>
